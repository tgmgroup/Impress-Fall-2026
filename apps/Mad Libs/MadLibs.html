<!doctype html>
<html lang="en" class="transition-colors duration-300">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Mad Scary Stories</title>
		<link
			rel="icon"
			type="image/x-icon"
			href="../../assets/nav-images/logo.png"
		/>
		<link
			id="favicon"
			rel="shortcut icon"
			href="../../assets/nav-images/logo.png"
		/>
		<script src="https://cdn.tailwindcss.com"></script>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
		<link rel="stylesheet" href="MadLibs.css" />
		<script>
			tailwind.config = {
				darkMode: "class",
				theme: {
					extend: {
						fontFamily: {
							display: ["Fredoka", "sans-serif"],
							sans: ["Inter", "sans-serif"],
						},
						colors: {
							funYellow: "#FFD166",
							funPink: "#EF476F",
							funGreen: "#06D6A0",
							funBlue: "#118AB2",
							funDark: "#073B4C",
							funPurple: "#8338EC",
						},
						animation: {
							"pop-in":
								"popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards",
						},
						keyframes: {
							popIn: {
								"0%": {
									opacity: "0",
									transform: "scale(0.92) translateY(10px)",
								},
								"100%": { opacity: "1", transform: "scale(1) translateY(0)" },
							},
						},
					},
				},
			};
		</script>
	</head>

	<body
		class="app-bg-light text-slate-800 dark:text-slate-100 p-3 sm:p-6 md:p-10 flex flex-col items-center justify-center min-h-screen transition-colors duration-300"
	>
		<div class="max-w-3xl w-full mx-auto">
			<!-- Top Utility Controls -->
			<div class="flex items-center justify-between mb-4 px-2">
				<button
					onclick="toggleLanguage()"
					class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-white/80 dark:bg-slate-800/80 hover:bg-white dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 font-semibold text-xs sm:text-sm border border-white/60 dark:border-slate-700 shadow-sm active:scale-95 transition-all"
				>
					<i class="fa-solid fa-language text-funPurple text-base"></i>
					<span id="lang-btn-label">English / 日本語</span>
				</button>
				<div
					class="inline-flex items-center justify-center bg-white/80 dark:bg-slate-800/80 backdrop-blur-md px-5 py-1.5 rounded-full shadow-sm mb-3 border border-white/90 dark:border-slate-700 gap-2"
				>
					<i
						class="fa-solid fa-wand-magic-sparkles text-funPurple text-lg animate-bounce"
					></i>
					<span
						id="story-counter-badge"
						class="font-display font-bold text-funPurple dark:text-purple-400 tracking-wide text-xs sm:text-sm"
					>
						Story 1 of 4
					</span>
				</div>
				<button
					onclick="toggleDarkMode()"
					class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-white/80 dark:bg-slate-800/80 hover:bg-white dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 font-semibold text-xs sm:text-sm border border-white/60 dark:border-slate-700 shadow-sm active:scale-95 transition-all"
				>
					<i
						id="theme-icon"
						class="fa-solid fa-moon text-funYellow text-base"
					></i>
					<span id="theme-btn-label">Dark Mode</span>
				</button>
			</div>

			<!-- Header Section -->
			<header class="text-center mb-6 sm:mb-8">
				<h1
					id="app-title"
					class="font-display text-3xl sm:text-5xl font-extrabold text-funDark dark:text-white tracking-tight drop-shadow-sm"
				>
					Mad
					<span
						class="text-transparent bg-clip-text bg-gradient-to-r from-funPink via-funPurple to-funBlue"
						>Scary Stories</span
					>
				</h1>
			</header>

			<!-- Main Container -->
			<main class="w-full">
				<!-- FORM SECTION (WORD CHOICES) -->
				<section
					id="form-section"
					class="glass-card-light dark:glass-card-dark rounded-3xl p-6 sm:p-8 shadow-xl shadow-funPurple/25 dark:shadow-slate-950/80 transition-all"
				>
					<div
						class="flex items-center justify-between mb-6 border-b border-gray-200/80 dark:border-slate-700 pb-4"
					>
						<div>
							<h2
								id="story-theme-title"
								class="font-display text-xl sm:text-2xl font-bold text-funDark dark:text-white flex items-center gap-2"
							>
								<i class="fa-solid fa-pen-to-square text-funPink"></i> Morning
								Rush
							</h2>
						</div>
						<span
							id="completion-counter"
							class="text-xs font-semibold px-3 py-1 bg-funPurple/10 dark:bg-funPurple/20 text-funPurple dark:text-purple-300 rounded-full"
						>
							0 / 6 filled
						</span>
					</div>

					<form
						id="madlibs-form"
						onsubmit="
							event.preventDefault();
							generateStory();
						"
						class="space-y-4"
					>
						<div
							id="dynamic-inputs-container"
							class="grid grid-cols-1 sm:grid-cols-2 gap-4"
						>
							<!-- Inputs dynamically rendered here -->
						</div>

						<div class="pt-4 flex flex-col gap-3">
							<button
								type="submit"
								id="btn-generate"
								class="w-full py-4 px-6 rounded-2xl font-display font-bold text-white bg-gradient-to-r from-funPink via-funPurple to-funBlue hover:opacity-95 active:scale-[0.98] transition-all shadow-lg hover:shadow-funPurple/30 flex items-center justify-center gap-2 text-lg"
							>
								<i class="fa-solid fa-play"></i>
								<span id="lbl-btn-generate">Generate Story!</span>
							</button>
							<div class="grid grid-cols-2 gap-3">
								<button
									type="button"
									onclick="randomizeWords()"
									class="py-2.5 px-4 rounded-xl font-semibold text-slate-800 dark:text-slate-100 bg-funYellow/80 dark:bg-yellow-600/80 hover:bg-funYellow dark:hover:bg-yellow-600 active:scale-95 transition-all text-xs sm:text-sm flex items-center justify-center gap-2 shadow-sm"
								>
									<i class="fa-solid fa-dice text-funDark dark:text-white"></i>
									<span id="lbl-btn-autofill">Auto-Fill Words</span>
								</button>
								<button
									type="button"
									onclick="clearForm()"
									class="py-2.5 px-4 rounded-xl font-semibold text-slate-600 dark:text-slate-300 bg-slate-200/80 dark:bg-slate-700/80 hover:bg-slate-300 dark:hover:bg-slate-700 active:scale-95 transition-all text-xs sm:text-sm flex items-center justify-center gap-2 shadow-sm"
								>
									<i class="fa-solid fa-eraser"></i>
									<span id="lbl-btn-clear">Clear</span>
								</button>
							</div>
						</div>
					</form>
				</section>

				<!-- STORY SECTION (YOUR STORY RESULT) -->
				<section
					id="story-section"
					class="hidden glass-card-light dark:glass-card-dark rounded-3xl p-6 sm:p-8 shadow-xl flex flex-col animate-pop-in"
				>
					<div
						class="flex items-center justify-between border-b border-gray-200/80 dark:border-slate-700 pb-4 mb-6"
					>
						<div class="flex items-center gap-2">
							<div class="w-3 h-3 rounded-full bg-funPink"></div>
							<div class="w-3 h-3 rounded-full bg-funYellow"></div>
							<div class="w-3 h-3 rounded-full bg-funGreen"></div>
							<h2
								id="result-story-title"
								class="font-display text-2xl font-bold text-funDark dark:text-white ml-2"
							>
								Your Story
							</h2>
						</div>
						<div class="flex items-center gap-2">
							<button
								onclick="copyToClipboard()"
								title="Copy Story"
								class="p-2.5 rounded-xl bg-white dark:bg-slate-700 hover:bg-slate-100 dark:hover:bg-slate-600 text-funDark dark:text-white border border-slate-200 dark:border-slate-600 transition-all text-xs sm:text-sm flex items-center gap-1.5 shadow-sm active:scale-95 font-semibold"
							>
								<i
									class="fa-regular fa-copy text-funPurple dark:text-purple-300"
								></i>
								<span class="hidden sm:inline" id="lbl-btn-copy">Copy</span>
							</button>
							<button
								onclick="readAloud()"
								id="tts-btn"
								title="Listen Story"
								class="p-2.5 rounded-xl bg-white dark:bg-slate-700 hover:bg-slate-100 dark:hover:bg-slate-600 text-funDark dark:text-white border border-slate-200 dark:border-slate-600 transition-all text-xs sm:text-sm flex items-center gap-1.5 shadow-sm active:scale-95 font-semibold"
							>
								<i
									class="fa-solid fa-volume-high text-funBlue dark:text-cyan-300"
								></i>
								<span class="hidden sm:inline" id="lbl-btn-listen">Listen</span>
							</button>
						</div>
					</div>

					<div
						id="story-output"
						class="bg-white/80 dark:bg-slate-900/80 rounded-2xl p-6 sm:p-8 border border-slate-200 dark:border-slate-700 custom-scrollbar overflow-y-auto leading-relaxed text-slate-800 dark:text-slate-100 text-base sm:text-xl space-y-4 font-medium mb-6"
					>
						<!-- Final generated story text -->
					</div>

					<div class="pt-2 grid grid-cols-1 sm:grid-cols-2 gap-3">
						<button
							onclick="resetCurrentStory()"
							class="w-full py-3.5 px-5 rounded-2xl font-display font-bold text-slate-700 dark:text-slate-200 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-base shadow-sm"
						>
							<i class="fa-solid fa-rotate-left"></i>
							<span id="lbl-btn-edit">Edit / Play Again</span>
						</button>
						<button
							onclick="goToNextStory()"
							class="w-full py-3.5 px-5 rounded-2xl font-display font-bold text-white bg-gradient-to-r from-funPurple to-funBlue hover:opacity-95 active:scale-[0.98] transition-all shadow-md flex items-center justify-center gap-2 text-base"
						>
							<span id="next-btn-text">Next Story</span>
							<i class="fa-solid fa-arrow-right"></i>
						</button>
					</div>
				</section>

				<!-- Toast Feedback Message -->
				<div
					id="toast"
					class="hidden mt-4 p-3 rounded-xl bg-funDark dark:bg-slate-800 text-white text-xs sm:text-sm font-semibold text-center border border-slate-700 animate-pop-in"
				>
					<span id="toast-message">Action completed!</span>
				</div>
			</main>

			<footer
				class="mt-8 text-center text-xs text-slate-600 dark:text-slate-400 font-medium"
			>
				<p
					id="app-subtitle"
					class="text-slate-700 dark:text-slate-300 font-medium mt-2 text-sm sm:text-base max-w-lg mx-auto"
				>
					Fill in the word prompts above, then press "Generate Story" to read
					your funny tale!
				</p>
				<br /><br />
				Interactive Mad Libs •
				<a
					href="https://impress-fall-2026.isesaki.in"
					class="underline hover:text-funPurple transition-colors"
					>Impress: Fall 2026</a
				>
				• Made with ❤️ by
				<a
					href="https://isesaki.in"
					class="underline hover:text-funPurple transition-colors"
					>Isesaki English Media</a
				>
			</footer>
		</div>

		<script src="Stories.js"></script>
		<script src="MadLibs.js"></script>
	</body>
</html>
